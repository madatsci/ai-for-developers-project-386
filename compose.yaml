services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      target: application
    environment:
      DATABASE_URL: postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      PORT: "${PORT:-8080}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
