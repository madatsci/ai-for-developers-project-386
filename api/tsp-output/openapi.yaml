                $ref: '#/components/schemas/CallTypeNotFoundError'
        '500':
          description: Server error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      tags:
        - Public call types
  /api/v1/public/call-types/{slug}/availability:
    get:
      operationId: getPublicCallTypeAvailability
      description: |-
        Returns candidate slots for today and the following 13 Moscow dates.
        Reading availability does not reserve a slot.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CallTypeSlug'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponseBody'
        '404':
          description: The server cannot find the requested resource.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTypeNotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTypeUnavailableError'
        '500':
          description: Server error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      tags:
        - Public call types
  /api/v1/public/calls:
    post:
      operationId: createCall
      description: |-
        Atomically rechecks availability and creates one immediately confirmed call.
        Repeating the same normalized request with the same key returns the original 201 response.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCall'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CallTypeChangedError'
                  - $ref: '#/components/schemas/CallTypeUnavailableError'
                  - $ref: '#/components/schemas/SlotUnavailableError'
                  - $ref: '#/components/schemas/IdempotencyConflictError'
        '415':
          description: Client error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedMediaTypeError'
        '422':
          description: Client error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      tags:
        - Public calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallRequest'
